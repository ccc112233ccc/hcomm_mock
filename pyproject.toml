[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hcomm-mock-synth"
version = "0.1.0"
description = "Independent HCOMM LLT DAG and traffic synthesis tooling."
requires-python = ">=3.10"
dependencies = [
    "protobuf>=4.21",
]

[project.scripts]
hcomm-mock-run = "hcomm_mock_synth.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["hcomm_mock_synth*"]
